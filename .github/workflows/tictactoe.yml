name: Tic-Tac-Toe Game Action Bot

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  tictactoe:
    if: startsWith(github.event.issue.title, 'TTT:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Play Move & Update Board
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python .github/scripts/tictactoe.py

      - name: Commit & Push README Update
        run: |
          git config --global user.name 'Linux Bot'
          git config --global user.email 'bot@github.com'
          git add README.md
          git commit -m "game: process Tic-Tac-Toe move for #${{ github.event.issue.number }}" || exit 0
          git push

      - name: Close Issue
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: "🎮 Move processed! README board has been updated."
